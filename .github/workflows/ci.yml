name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify zero runtime @opencode/plugin imports in dist
        run: |
          if grep -rn --include="*.js" "@opencode/plugin" dist/; then
            echo "Unexpected runtime import of @opencode/plugin in dist/"
            exit 1
          fi

  test-matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  test:
    needs: [check, test-matrix]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "check=${{ needs.check.result }} test-matrix=${{ needs.test-matrix.result }}"
            exit 1
          fi
